global
  log stdout format raw local0
  maxconn 2048

defaults
  mode tcp
  log global
  option tcplog
  timeout connect 5s
  timeout client 35s
  timeout server 35s

frontend arena_tcp
  bind 0.0.0.0:19100
  default_backend arena_tcp_local

backend arena_tcp_local
  server arena_core arena-core:9100 check

frontend arena_observer
  bind 0.0.0.0:18080
  default_backend arena_observer_local

backend arena_observer_local
  server arena_core arena-core:8080 check
