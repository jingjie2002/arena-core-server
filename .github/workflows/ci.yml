name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  release-contract:
    runs-on: ubuntu-24.04
    name: README and Compose release contract
    steps:
      - uses: actions/checkout@v4
      - name: Check public entry scripts
        run: |
          bash -n scripts/doctor.sh scripts/demo-up.sh scripts/smoke.sh scripts/demo-down.sh scripts/release/m8-clean-copy-check.sh scripts/release/m8-local-clone-check.sh
          test -f README.md
          test -f Dockerfile
          test -f compose.yaml
          test -f LICENSE
          test -f docs/known-limitations.md
          grep -q 'kProjectVersion = "1.0.1"' include/arena_core/core/version.hpp
          ! grep -RInE '[[:blank:]]+$' README.md Dockerfile compose.yaml deploy scripts docs
      - name: Validate Compose without starting services
        run: docker compose config --quiet

  fresh-clone-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    name: Isolated native and Compose release smoke
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang libboost-system-dev libboost-thread-dev libprotobuf-dev protobuf-compiler libspdlog-dev nlohmann-json3-dev libgtest-dev libmysqlcppconn-dev libhiredis-dev liblua5.4-dev pkg-config
      - name: Run clean-copy release check
        run: ./scripts/release/m8-clean-copy-check.sh

  linux-cpp17:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: GCC 13
            preset: linux-gcc
          - compiler: Clang 18
            preset: linux-clang
    name: ${{ matrix.compiler }} / C++17
    steps:
      - uses: actions/checkout@v4
      - name: Install C++17 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang libboost-system-dev libboost-thread-dev libprotobuf-dev protobuf-compiler libspdlog-dev nlohmann-json3-dev libgtest-dev libmysqlcppconn-dev libhiredis-dev liblua5.4-dev pkg-config
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  manifest-contract:
    runs-on: ubuntu-24.04
    name: Pinned vcpkg manifest contract
    steps:
      - uses: actions/checkout@v4
      - name: Verify manifest baseline and planned features
        shell: python
        run: |
          import json
          from pathlib import Path

          manifest = json.loads(Path("vcpkg.json").read_text(encoding="utf-8"))
          assert len(manifest["builtin-baseline"]) == 40
          assert {"data", "observer", "rules"} == set(manifest["features"])
          assert {"boost-asio", "protobuf", "spdlog", "gtest"}.issubset(manifest["dependencies"])
          assert {"data", "rules"} == set(manifest["default-features"])
          assert set(manifest["features"]["data"]["dependencies"]) == {"mysql-connector-cpp", "hiredis"}
          assert manifest["features"]["rules"]["dependencies"] == ["lua"]

  sanitizers:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Clang 18 ASan + UBSan
            preset: linux-clang-asan-ubsan
            labels: ".*"
          - name: GCC 13 TSan reduced concurrency
            preset: linux-gcc-tsan
            labels: "unit|protocol|network|qa"
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Install C++17 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang libboost-system-dev libboost-thread-dev libprotobuf-dev protobuf-compiler libspdlog-dev nlohmann-json3-dev libgtest-dev libmysqlcppconn-dev libhiredis-dev liblua5.4-dev pkg-config
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Sanitizer tests
        run: ctest --preset ${{ matrix.preset }} -L '${{ matrix.labels }}'
