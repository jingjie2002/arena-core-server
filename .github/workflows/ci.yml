name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-contract:
    runs-on: ubuntu-24.04
    name: M12 public entry and Compose contracts
    steps:
      - uses: actions/checkout@v4
      - name: Check tracked shell entrypoints
        shell: bash
        run: |
          mapfile -t shell_scripts < <(git ls-files '*.sh')
          test "${#shell_scripts[@]}" -gt 0
          bash -n "${shell_scripts[@]}"
          test -x scripts/doctor.sh
          test -x scripts/demo-up.sh
          test -x scripts/smoke.sh
          test -x scripts/lab-smoke.sh
          test -x scripts/demo-down.sh
          test -x scripts/release/m8-clean-copy-check.sh
          test -x scripts/release/m8-local-clone-check.sh
      - name: Check v1.1 release contract and JSON documents
        shell: python
        run: |
          import json
          import pathlib
          import subprocess

          required = [
              "README.md",
              "Dockerfile",
              "compose.yaml",
              "LICENSE",
              "docs/known-limitations.md",
              "config/arena-core-lab.example.json",
          ]
          for value in required:
              assert pathlib.Path(value).is_file(), f"missing release file: {value}"

          version = pathlib.Path("include/arena_core/core/version.hpp").read_text(encoding="utf-8")
          cmake = pathlib.Path("CMakeLists.txt").read_text(encoding="utf-8")
          assert 'kProjectVersion = "1.1.0"' in version
          assert "VERSION 1.1.0" in cmake

          tracked = subprocess.check_output(
              ["git", "ls-files", "*.json"], text=True, encoding="utf-8"
          ).splitlines()
          assert tracked
          for value in tracked:
              json.loads(pathlib.Path(value).read_text(encoding="utf-8"))
      - name: Validate default and Lab Compose without starting services
        shell: bash
        run: |
          mkdir -p .runtime/lab-runs
          cp config/arena-core.demo.json .runtime/arena-core.json
          cp config/arena-core-lab.example.json .runtime/arena-lab.json
          printf '[]\n' > .runtime/toxiproxy.json
          docker compose config --quiet
          docker compose --profile lab config --quiet
      - name: Reject trailing whitespace in release materials
        shell: bash
        run: |
          ! grep -RInE '[[:blank:]]+$' README.md Dockerfile compose.yaml deploy scripts docs web config .github
          ! grep -RIn 'style=' web/lab web/observer

  git-clone-compose-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    name: Detached Git clone / GCC / real deps / Compose Lab
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang libboost-system-dev libboost-thread-dev libprotobuf-dev protobuf-compiler libspdlog-dev nlohmann-json3-dev libgtest-dev libmysqlcppconn-dev libhiredis-dev liblua5.4-dev pkg-config
      - name: Run M12 isolated Git acceptance
        env:
          ARENA_RELEASE_COMMIT: ${{ github.sha }}
        run: ./scripts/release/m8-local-clone-check.sh

  linux-cpp17:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: GCC 13
            preset: linux-gcc
          - compiler: Clang 18
            preset: linux-clang
    name: ${{ matrix.compiler }} / C++17
    steps:
      - uses: actions/checkout@v4
      - name: Install C++17 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang libboost-system-dev libboost-thread-dev libprotobuf-dev protobuf-compiler libspdlog-dev nlohmann-json3-dev libgtest-dev libmysqlcppconn-dev libhiredis-dev liblua5.4-dev pkg-config
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test all discovered tests
        run: ctest --preset ${{ matrix.preset }}

  real-data-and-m9:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    name: Real MySQL + Redis and trusted-result E2E
    steps:
      - uses: actions/checkout@v4
      - name: Install build and real dependency services
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libboost-system-dev libboost-thread-dev libprotobuf-dev protobuf-compiler libspdlog-dev nlohmann-json3-dev libgtest-dev libmysqlcppconn-dev libhiredis-dev liblua5.4-dev pkg-config mysql-server redis-server
      - name: Configure and build GCC
        run: |
          cmake --preset linux-gcc
          cmake --build --preset linux-gcc
      - name: Exercise real MySQL and Redis
        run: ./scripts/dev/m5-data-integration.sh out/build/linux-gcc
      - name: Exercise trusted result ingress
        run: ./scripts/dev/m9-e2e.sh out/build/linux-gcc

  manifest-contract:
    runs-on: ubuntu-24.04
    name: Pinned vcpkg manifest contract
    steps:
      - uses: actions/checkout@v4
      - name: Verify manifest baseline and planned features
        shell: python
        run: |
          import json
          from pathlib import Path

          manifest = json.loads(Path("vcpkg.json").read_text(encoding="utf-8"))
          assert len(manifest["builtin-baseline"]) == 40
          assert {"data", "observer", "rules"} == set(manifest["features"])
          assert {"boost-asio", "protobuf", "spdlog", "gtest"}.issubset(manifest["dependencies"])
          assert {"data", "rules"} == set(manifest["default-features"])
          assert set(manifest["features"]["data"]["dependencies"]) == {"mysql-connector-cpp", "hiredis"}
          assert manifest["features"]["rules"]["dependencies"] == ["lua"]

  sanitizers:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Clang 18 ASan + UBSan
            preset: linux-clang-asan-ubsan
            labels: ".*"
          - name: GCC 13 TSan reduced concurrency
            preset: linux-gcc-tsan
            labels: "unit|protocol|network|game|observer|qa|lab"
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Install C++17 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang libboost-system-dev libboost-thread-dev libprotobuf-dev protobuf-compiler libspdlog-dev nlohmann-json3-dev libgtest-dev libmysqlcppconn-dev libhiredis-dev liblua5.4-dev pkg-config
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Sanitizer tests
        run: ctest --preset ${{ matrix.preset }} -L '${{ matrix.labels }}'
